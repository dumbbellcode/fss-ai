<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSSAI Regulation Assistant</title>
<style>
  :root { --brand: #1a5d2c; --bg: #f4f6f4; --bubble: #e8efe9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #1c231d; }
  header { background: var(--brand); color: #fff; padding: 14px 20px; font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 120px); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--brand); color: #fff; }
  .assistant { align-self: flex-start; background: var(--bubble); }
  .sources { margin-top: 8px; font-size: 12px; color: #4a554c; border-top: 1px solid #c8d2ca; padding-top: 6px; }
  .sources span { display: block; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #dfe5e0; }
  input { flex: 1; padding: 10px 12px; border: 1px solid #c3cdc5; border-radius: 8px; font-size: 15px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .typing::after { content: "…"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>FSSAI Regulation Assistant</header>
<main>
  <div id="messages"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask about FSSAI regulations…" autocomplete="off">
    <button id="send" type="submit">Ask</button>
  </form>
</main>
<script>
  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function addMessage(role, text, sources) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    if (sources && sources.length) {
      const box = document.createElement("div");
      box.className = "sources";
      box.append(...sources.map(s => {
        const el = document.createElement("span");
        const parts = [];
        for (const key of ["regulation", "chapter", "section", "subsection", "schedule", "annexure", "form"]) {
          if (s[key] !== null && s[key] !== undefined) parts.push(key + " " + s[key]);
        }
        el.textContent = parts.join(", ") || "source";
        return el;
      }));
      div.appendChild(box);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function ask(message) {
    const typing = addMessage("assistant", "Thinking");
    typing.classList.add("typing");
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Request failed");
      typing.classList.remove("typing");
      typing.textContent = data.answer;
      const box = document.createElement("div");
      box.className = "sources";
      box.append(...data.sources.map(s => {
        const el = document.createElement("span");
        const parts = [];
        for (const key of ["regulation", "chapter", "section", "subsection", "schedule", "annexure", "form"]) {
          if (s[key] !== null && s[key] !== undefined) parts.push(key + " " + s[key]);
        }
        el.textContent = parts.join(", ") || "source";
        return el;
      }));
      if (data.sources.length) typing.appendChild(box);
    } catch (err) {
      typing.classList.remove("typing");
      typing.textContent = "Error: " + err.message;
    } finally {
      send.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addMessage("user", message);
    input.value = "";
    ask(message);
  });
</script>
</body>
</html>

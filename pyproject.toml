[project]
name = "fssai-rag"
version = "0.1.0"
description = "Download and convert FSSAI regulations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "markitdown[pdf]>=0.1.7",
    "pydantic>=2.10.0",
    "pymupdf>=1.28.0",
    "requests>=2.32.0",
    "tiktoken>=0.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call the real LLM (run with -m integration)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
